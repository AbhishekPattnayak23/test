[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formats]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

# Database URL configuration (can be overridden by environment variable)
sqlalchemy.url = sqlite:///./app.db

# PostgreSQL example:
# sqlalchemy.url = postgresql://postgres:password@localhost:5432/cv_villas_db

# Target metadata
[alembic:autogenerate]
compare_type = true
compare_server_default = true

# Template configuration
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d%%(second).2d_%%(rev)s_%%(slug)s